steps:
  # ── 1. Unit tests ──────────────────────────────────────────────────────────
  - id: unit-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --upgrade pip --quiet
        pip install -e ".[dev]" --quiet
        python -m pytest tests/unit -x -q
    env:
      - FIRESTORE_EMULATOR_HOST=localhost:8080
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test

  # ── 2. Build base image ────────────────────────────────────────────────────
  - id: build-base
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:$_TAG
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:latest
      - -f
      - docker/base.Dockerfile
      - .
    waitFor: [unit-tests]

  # ── 3. Build editor image ──────────────────────────────────────────────────
  - id: build-editor
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/editor:$_TAG
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/editor:latest
      - -f
      - docker/editor.Dockerfile
      - --build-arg
      - BASE_IMAGE=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:$_TAG
      - .
    waitFor: [build-base]

  # ── 4. Build researcher image ──────────────────────────────────────────────
  - id: build-researcher
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/researcher:$_TAG
      - -t
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/researcher:latest
      - -f
      - docker/researcher.Dockerfile
      - --build-arg
      - BASE_IMAGE=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:$_TAG
      - .
    waitFor: [build-base]

  # ── 5. Push images ─────────────────────────────────────────────────────────
  - id: push-base
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:$_TAG']
    waitFor: [build-base]

  - id: push-base-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/base:latest']
    waitFor: [build-base]

  - id: push-editor
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/editor:$_TAG']
    waitFor: [build-editor]

  - id: push-editor-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/editor:latest']
    waitFor: [build-editor]

  - id: push-researcher
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/researcher:$_TAG']
    waitFor: [build-researcher]

  - id: push-researcher-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/researcher:latest']
    waitFor: [build-researcher]

  # ── 6. Deploy Editor to Cloud Run ──────────────────────────────────────────
  - id: deploy-editor
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - glass-record-editor
      - --image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/editor:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=glass-record-agent@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-1.5-pro-002
      - --min-instances=0
      - --max-instances=10
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
    waitFor: [push-editor]

  # ── 7. Deploy Researcher to Cloud Run ─────────────────────────────────────
  - id: deploy-researcher
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - glass-record-researcher
      - --image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/researcher:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=glass-record-agent@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-1.5-pro-002,RESEARCHER_MODE=pubsub
      - --min-instances=0
      - --max-instances=50
      - --memory=4Gi
      - --cpu=4
      - --timeout=900
    waitFor: [push-researcher]

substitutions:
  _AR_REGION: us-central1
  _AR_REPO: agents
  _REGION: us-central1
  _TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

timeout: 1800s
