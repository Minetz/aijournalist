[project]
name = "glass-record"
version = "0.1.0"
description = "Autonomous AI journalism platform"
requires-python = ">=3.12"

dependencies = [
    # LLM & orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=4.0",
    "google-genai>=1.0",

    # GCP / Firestore
    "google-cloud-firestore>=2.23",
    "google-cloud-storage>=2.16",
    "google-cloud-pubsub>=2.21",
    "google-cloud-scheduler>=2.13",

    # Web browsing / search
    "browser-use>=0.1",
    "playwright>=1.44",

    # Document processing
    "docling>=2.70",

    # Knowledge graph
    "neo4j>=5.28",

    # HTTP / serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # Data / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Utilities
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "cms*", "graph*"]
