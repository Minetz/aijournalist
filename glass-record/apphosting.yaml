runConfig:
  cpu: 2
  memoryMiB: 1024
  maxInstances: 10
  minInstances: 0
  concurrency: 100

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_EDITOR_URL
    secret: EDITOR_SERVICE_URL
    availability:
      - BUILD
      - RUNTIME
